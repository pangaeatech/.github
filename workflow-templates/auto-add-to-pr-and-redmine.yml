name: Automatically Create PR and Add to Redmine on New Branches
concurrency: auto-pr-${{ github.ref }}
on:
  push:
    branches-ignore:
      - $default-branch
      - "dependabot/**"
      - "renovate/**"
      - "whitesource/**"
      # Add any other branches you want to ignore

permissions:
  contents: write
  pull-requests: write
  repository-projects: read
  actions: read
  statuses: read
  checks: read

env:
  DEFAULT_BRANCH: $default-branch
  REDMINE_URL: "https://redmine.mycompany.com" # Set to your URL
  REDMINE_PROJECT_ID: "projectid" # Set to your project id
  REDMINE_FIELD_ID: 11 # Set to your field id
  REDMINE_TRACKER_ID: 13 # Set to your tracker id (optional)
  REDMINE_VERSION_ID: 10 # Set to your version id (optional)

jobs:
  pull-request:
    uses: pangaeatech/.github/.github/workflows/auto-add-pr.yml@main
    with:
      base_branch: ${{ env.DEFAULT_BRANCH }}
      pr_title: ${{ github.ref_name }}

  extractnum:
    needs: pull-request
    if: ${{ needs.pull-request.outputs.pr_url && needs.pull-request.outputs.pr_created == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      issue: ${{ steps.extract.outputs.replaced }}
    steps:
      - id: extract
        uses: frabert/replace-string-action@v2.5
        with:
          pattern: "^(task|issue|bug)(\\d+)-.*$"
          flags: "i"
          string: "${{ github.ref_name }}"
          replace-with: "$2"

  link-to-redmine:
    needs: [extractnum, pull-request]
    if: ${{ needs.pull-request.outputs.pr_url && needs.pull-request.outputs.pr_created == 'true' && needs.extractnum.outputs.issue != github.ref_name }}
    uses: pangaeatech/.github/.github/workflows/link-to-redmine.yml@main
    with:
      pr_num: ${{ needs.pull-request.outputs.pr_num }}
      pr_url: ${{ needs.pull-request.outputs.pr_url }}
      rm_issue: ${{ needs.extractnum.outputs.issue }}
      rm_url: ${{ env.REDMINE_URL }}
      rm_field_id: ${{ env.REDMINE_FIELD_ID }}
    secrets:
      rm_key: ${{ secrets.REDMINE_API_KEY }}

  add-to-redmine:
    needs: [extractnum, pull-request]
    if: ${{ needs.pull-request.outputs.pr_url && needs.pull-request.outputs.pr_created == 'true' && needs.extractnum.outputs.issue == github.ref_name }}
    uses: pangaeatech/.github/.github/workflows/add-to-redmine.yml@main
    with:
      pr_num: ${{ needs.pull-request.outputs.pr_num }}
      pr_url: ${{ needs.pull-request.outputs.pr_url }}
      pr_subject: ${{ github.ref_name }}
      rm_url: ${{ env.REDMINE_URL }}
      rm_project_id: ${{ env.REDMINE_PROJECT_ID }}
      rm_field_id: ${{ env.REDMINE_FIELD_ID }}
      rm_tracker_id: ${{ env.REDMINE_TRACKER_ID }}
      rm_version_id: ${{ env.REDMINE_VERSION_ID }}
    secrets:
      rm_key: ${{ secrets.REDMINE_API_KEY }}
