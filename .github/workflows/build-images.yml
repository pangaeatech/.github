name: Build images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Test build
        if: github.ref_type != 'tag'
        run: |
          for f in *.dockerfile; do
            docker buildx build --file "$f" .
          done

      - id: v
        if: github.ref_type == 'tag'
        uses: ./.github/actions/get-version
        with:
          version-file: package.json

      - if: github.ref_type == 'tag'
        uses: ./.github/actions/push-to-docker
        with:
          release: ${{ steps.v.outputs.release }}
