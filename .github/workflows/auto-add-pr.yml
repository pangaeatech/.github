name: Automatically Create PR on New Branches
concurrency: auto-pr-${{ github.ref }}
on:
  push:
    branches-ignore:
      - "main"
      - "dependabot/**"
      - "renovate/**"
      - "whitesource/**"
  workflow_call:
    inputs:
      base_branch:
        description: The branch to open the pull request against
        required: false
        type: string
        default: "main"
      pr_title:
        description: The pull request title
        required: false
        type: string
        default: ""
      create_if_missing:
        description: Whether to create a pull request when one does not already exist
        required: false
        type: string
        default: "true"
    outputs:
      pr_url:
        description: URL of the pull request for the current branch
        value: ${{ jobs.pull-request.outputs.pr_url }}
      pr_num:
        description: Number of the pull request for the current branch
        value: ${{ jobs.pull-request.outputs.pr_num }}
      pr_created:
        description: True when this run created the pull request
        value: ${{ jobs.pull-request.outputs.pr_created }}

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

jobs:
  pull-request:
    runs-on: ubuntu-latest
    outputs:
      pr_url: ${{ steps.open-pr.outputs.pr_url }}
      pr_num: ${{ steps.open-pr.outputs.pr_num }}
      pr_created: ${{ steps.open-pr.outputs.pr_created }}
    steps:
      - uses: actions/checkout@v7

      - id: open-pr
        run: |
          set -euo pipefail
          PR_NUM="$(gh pr list --head "$HEAD_SELECTOR" --state open --json number --jq '.[0].number // ""')"
          PR_URL="$(gh pr list --head "$HEAD_SELECTOR" --state open --json url --jq '.[0].url // ""')"
          if [ -n "$PR_NUM" ]; then
            PR_CREATED="false"
          elif [ "$CREATE_IF_MISSING" != "true" ]; then
            PR_CREATED="false"
            echo "pr_created=$PR_CREATED" >> "$GITHUB_OUTPUT"
            echo "pr_num=" >> "$GITHUB_OUTPUT"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          else
            gh pr create -d -B "$BASE_BRANCH" -t "$PR_TITLE" -b ""
            PR_CREATED="true"
            PR_NUM="$(gh pr list --head "$HEAD_SELECTOR" --state open --json number --jq '.[0].number // ""')"
            PR_URL="$(gh pr list --head "$HEAD_SELECTOR" --state open --json url --jq '.[0].url // ""')"
          fi
          if [ -z "$PR_NUM" ] || [ -z "$PR_URL" ]; then
            echo "::error::Failed to resolve pull request for branch $HEAD_SELECTOR"
            exit 1
          fi
          echo "pr_created=$PR_CREATED" >> "$GITHUB_OUTPUT"
          echo "pr_num=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
        env:
          BASE_BRANCH: ${{ inputs.base_branch || 'main' }}
          PR_TITLE: ${{ inputs.pr_title || github.ref_name }}
          CREATE_IF_MISSING: ${{ inputs.create_if_missing || 'true' }}
          HEAD_SELECTOR: ${{ github.repository_owner }}:${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
