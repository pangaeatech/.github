name: push-to-docker
description: Build and push *.dockerfile in the repo root to ghcr.io
inputs:
  github-token:
    description: Token used for the GitHub API / gh CLI
    required: false
    default: ${{ github.token }}
  release:
    description: Release from get-version
    required: true
  dockerfile-ext:
    description: Dockerfile extension
    required: false
    default: "dockerfile"
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}
    - name: Run push_to_docker.sh
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
        DOCKERFILE_EXT: ${{ inputs.dockerfile-ext }}
      run: scripts/push_to_docker.sh
